Screens:
  SettingsScreen:
    Properties:
      Fill: =RGBA(250, 250, 250, 1)
    Children:
      - lblSettings:
          Control: Label
          Properties:
            Text: ="Settings"
      - tglNotifications:
          Control: Toggle
          Properties:
            Default: =true
            OnCheck: =Set(varNotifications, true)
            OnUncheck: =Set(varNotifications, false)
